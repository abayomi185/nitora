name: Publish Homebrew Formula

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish
        required: true
        type: string

jobs:
  publish-homebrew-formula:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout source repo
        uses: actions/checkout@v4

      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "release" ]]; then
            tag="${{ github.event.release.tag_name }}"
          else
            tag="${{ inputs.tag }}"
          fi

          if [[ -z "${tag}" ]]; then
            echo "No release tag provided" >&2
            exit 1
          fi

          tap_repo="${{ vars.HOMEBREW_TAP_REPO }}"
          if [[ -z "${tap_repo}" ]]; then
            tap_repo="${GITHUB_REPOSITORY_OWNER}/homebrew-tap"
          fi

          base_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}"

          # Download both architecture tarballs and compute SHA256
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            tarball="nitora-${tag}-${target}.tar.gz"
            url="${base_url}/${tarball}"
            echo "Downloading ${url}"
            curl -fsSL "${url}" -o "${tarball}"
          done

          sha256_arm="$(sha256sum "nitora-${tag}-aarch64-apple-darwin.tar.gz" | awk '{print $1}')"
          sha256_intel="$(sha256sum "nitora-${tag}-x86_64-apple-darwin.tar.gz" | awk '{print $1}')"

          # Read package metadata from Cargo.toml
          python3 <<'PY' >> "$GITHUB_OUTPUT"
          from pathlib import Path
          import tomllib

          package = tomllib.loads(Path("Cargo.toml").read_text())["package"]
          name = package["name"]
          formula_class = "".join(part.capitalize() for part in name.replace("_", "-").split("-"))
          print(f"formula_name={name}")
          print(f"formula_class={formula_class}")
          print(f"description={package['description']}")
          print(f"license={package['license']}")
          PY

          # Strip leading 'v' for the version field
          version="${tag#v}"

          {
            echo "tag=${tag}"
            echo "version=${version}"
            echo "base_url=${base_url}"
            echo "sha256_arm=${sha256_arm}"
            echo "sha256_intel=${sha256_intel}"
            echo "tap_repo=${tap_repo}"
          } >> "$GITHUB_OUTPUT"

      - name: Check required secret
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${GH_TOKEN}" ]]; then
            echo "Missing HOMEBREW_TAP_TOKEN secret" >&2
            exit 1
          fi

      - name: Clone tap repo
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          gh auth setup-git
          gh repo clone "${{ steps.meta.outputs.tap_repo }}" tap -- --depth=1

      - name: Write formula
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p tap/Formula

          cat > "tap/Formula/${{ steps.meta.outputs.formula_name }}.rb" <<FORMULA
          class ${{ steps.meta.outputs.formula_class }} < Formula
            desc "${{ steps.meta.outputs.description }}"
            homepage "https://github.com/${GITHUB_REPOSITORY}"
            version "${{ steps.meta.outputs.version }}"
            license "${{ steps.meta.outputs.license }}"

            on_arm do
              url "${{ steps.meta.outputs.base_url }}/nitora-${{ steps.meta.outputs.tag }}-aarch64-apple-darwin.tar.gz"
              sha256 "${{ steps.meta.outputs.sha256_arm }}"
            end

            on_intel do
              url "${{ steps.meta.outputs.base_url }}/nitora-${{ steps.meta.outputs.tag }}-x86_64-apple-darwin.tar.gz"
              sha256 "${{ steps.meta.outputs.sha256_intel }}"
            end

            depends_on :macos

            def install
              bin.install "nitora"
            end

            test do
              assert_match "${{ steps.meta.outputs.formula_name }}", shell_output("\#{bin}/${{ steps.meta.outputs.formula_name }} --help")
            end
          end
          FORMULA

      - name: Commit and push formula update
        working-directory: tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- "Formula/${{ steps.meta.outputs.formula_name }}.rb"; then
            echo "Formula already up to date"
            exit 0
          fi

          git add "Formula/${{ steps.meta.outputs.formula_name }}.rb"
          git \
            -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "${{ steps.meta.outputs.formula_name }} ${{ steps.meta.outputs.tag }}"
          git push origin HEAD
