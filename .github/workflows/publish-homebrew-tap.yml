name: Publish Homebrew Formula

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish
        required: true
        type: string

jobs:
  publish-homebrew-formula:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout source repo
        uses: actions/checkout@v4

      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "release" ]]; then
            tag="${{ github.event.release.tag_name }}"
          else
            tag="${{ inputs.tag }}"
          fi

          if [[ -z "${tag}" ]]; then
            echo "No release tag provided" >&2
            exit 1
          fi

          tap_repo="${{ vars.HOMEBREW_TAP_REPO }}"
          if [[ -z "${tap_repo}" ]]; then
            tap_repo="${GITHUB_REPOSITORY_OWNER}/homebrew-nitora"
          fi

          archive_url="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${tag}.tar.gz"
          curl -fsSL "${archive_url}" -o source.tar.gz
          sha256="$(sha256sum source.tar.gz | awk '{print $1}')"

          python <<'PY' >> "$GITHUB_OUTPUT"
from pathlib import Path
import tomllib

package = tomllib.loads(Path("Cargo.toml").read_text())["package"]
name = package["name"]
formula_class = "".join(part.capitalize() for part in name.replace("_", "-").split("-"))
print(f"formula_name={name}")
print(f"formula_class={formula_class}")
print(f"description={package['description']}")
print(f"license={package['license']}")
PY

          {
            echo "tag=${tag}"
            echo "archive_url=${archive_url}"
            echo "sha256=${sha256}"
            echo "tap_repo=${tap_repo}"
          } >> "$GITHUB_OUTPUT"

      - name: Check required secret
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${GH_TOKEN}" ]]; then
            echo "Missing HOMEBREW_TAP_TOKEN secret" >&2
            exit 1
          fi

      - name: Clone tap repo
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          gh auth setup-git
          gh repo clone "${{ steps.meta.outputs.tap_repo }}" tap -- --depth=1

      - name: Write formula
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p tap/Formula

          cat > "tap/Formula/${{ steps.meta.outputs.formula_name }}.rb" <<EOF
          class ${{ steps.meta.outputs.formula_class }} < Formula
            desc "${{ steps.meta.outputs.description }}"
            homepage "https://github.com/${GITHUB_REPOSITORY}"
            url "${{ steps.meta.outputs.archive_url }}"
            sha256 "${{ steps.meta.outputs.sha256 }}"
            license "${{ steps.meta.outputs.license }}"

            depends_on :macos
            depends_on "rust" => :build

            def install
              system "cargo", "install", *std_cargo_args(path: ".")
            end

            test do
              assert_match "${{ steps.meta.outputs.formula_name }}", shell_output("\#{bin}/${{ steps.meta.outputs.formula_name }} --help")
            end
          end
          EOF

      - name: Commit and push formula update
        working-directory: tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- "Formula/${{ steps.meta.outputs.formula_name }}.rb"; then
            echo "Formula already up to date"
            exit 0
          fi

          git add "Formula/${{ steps.meta.outputs.formula_name }}.rb"
          git \
            -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "${{ steps.meta.outputs.formula_name }} ${{ steps.meta.outputs.tag }}"
          git push origin HEAD
