[package]
name = "nitora"
version = "0.4.0"
edition = "2024"
description = "macOS XDR/EDR brightness control CLI"
license = "MIT"
keywords = ["macos", "cli", "brightness", "xdr", "edr"]
categories = ["command-line-utilities", "os::macos-apis"]

[package.metadata]
supported-platforms = ["x86_64-apple-darwin", "aarch64-apple-darwin"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
dirs = "6.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics2 = { version = "0.5", default-features = false, features = [
  "display",
] }
objc2 = ">=0.6.2, <0.8.0"
objc2-app-kit = "0.3.2"
objc2-core-foundation = { version = "0.3.2", default-features = false, features = [
  "std",
  "CFData",
  "CFString",
  "CFDictionary",
] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = [
  "CGColorSpace",
] }
objc2-foundation = "0.3.2"
objc2-io-kit = "0.3.2"
objc2-metal = "0.3.2"
objc2-quartz-core = "0.3.2"
